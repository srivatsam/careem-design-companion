name: Tear down Azure MVP

# Deletes ONLY the resource group rg-perfume-agent-mvp, and only if it is tagged
# project=perfume-agent-mvp and environment=disposable (checked by infra/teardown.sh).
#
# Runs only when started by hand (Actions > Tear down Azure MVP > Run workflow).
# The scheduled run was removed on 2026-09-29: the environment stays up until the owner decides to remove it.
on:
  workflow_dispatch:

concurrency:
  group: perfume-agent-mvp-azure
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  teardown:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HAS_AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (service principal secret)
        if: env.HAS_AZURE_CREDENTIALS == 'true'
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Azure login (OIDC)
        if: env.HAS_AZURE_CREDENTIALS != 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Tear down
        env:
          AZ_SUBSCRIPTION: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: infra/teardown.sh --yes
