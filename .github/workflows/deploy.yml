name: Deploy to Azure Container Apps

on:
  workflow_dispatch:
    inputs:
      location:
        description: Azure region
        required: false
        default: uaenorth
      image_tag:
        description: Image tag (defaults to the commit short sha)
        required: false
        default: ''
  push:
    branches:
      - claude/dreamy-faraday-3vhoig
    paths:
      - 'app/**'
      - 'data/**'
      - 'infra/**'
      - 'scripts/**'
      - 'Dockerfile'
      - 'requirements.txt'

# Shared with teardown.yml so a deploy and a teardown never run at the same time.
concurrency:
  group: perfume-agent-mvp-azure
  cancel-in-progress: false

permissions:
  contents: read
  packages: write   # push the image to ghcr.io with GITHUB_TOKEN
  id-token: write   # only needed for the OIDC login path

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HAS_AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS != '' }}
    steps:
      - uses: actions/checkout@v4

      # Optional: bake the Kaggle catalogue into the image. Never fails the workflow.
      - name: Fetch Kaggle dataset (optional)
        continue-on-error: true
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: scripts/fetch_kaggle.sh || echo "kaggle download skipped"

      - name: Image name
        id: image
        env:
          INPUT_TAG: ${{ inputs.image_tag }}
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          tag="${INPUT_TAG:-$(git rev-parse --short HEAD)}"
          echo "repo=ghcr.io/${owner}/perfume-agent" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The first push creates the package as PRIVATE. Either make it public once
      # (GitHub > Packages > perfume-agent > Package settings > Change visibility; there is no REST API for this),
      # or set the GHCR_PULL_TOKEN secret so the Container App pulls with credentials.
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.repo }}:${{ steps.image.outputs.tag }}
            ${{ steps.image.outputs.repo }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Azure login, path 1 (used when the AZURE_CREDENTIALS secret is set): the JSON printed by
      #   az ad sp create-for-rbac --name sp-perfume-agent-mvp --role Contributor \
      #     --scopes /subscriptions/<sub-id> --sdk-auth
      - name: Azure login (service principal secret)
        if: env.HAS_AZURE_CREDENTIALS == 'true'
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Azure login, path 2 (used when AZURE_CREDENTIALS is not set): OIDC federated credential, no stored secret.
      # Needs AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID; see infra/README.md.
      - name: Azure login (OIDC)
        if: env.HAS_AZURE_CREDENTIALS != 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy
        env:
          IMAGE: ${{ steps.image.outputs.repo }}:${{ steps.image.outputs.tag }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}          # optional; empty = anonymous pull (public package)
          GHCR_USERNAME: ${{ github.repository_owner }}
          AZ_SUBSCRIPTION: ${{ secrets.AZURE_SUBSCRIPTION_ID }}    # optional; empty = subscription from the login
          AZ_LOCATION: ${{ inputs.location || 'uaenorth' }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_CHAT_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_CHAT_DEPLOYMENT }}
          AZURE_OPENAI_EMBED_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_EMBED_DEPLOYMENT }}
          AZURE_OPENAI_IMAGE_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_IMAGE_DEPLOYMENT }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          BRAND_FILTER: ${{ vars.BRAND_FILTER }}
          DEPLOY_SCOPE: ${{ vars.DEPLOY_SCOPE }}   # blank = subscription; 'group' for least privilege
        run: infra/deploy.sh
