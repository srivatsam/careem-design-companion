name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Tests
        run: python -m pytest -q

  infra:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Standalone Bicep CLI from GitHub releases: no Azure login needed.
      - name: Install Bicep
        run: |
          curl -fsSLo bicep https://github.com/Azure/bicep/releases/latest/download/bicep-linux-x64
          chmod +x bicep
          sudo mv bicep /usr/local/bin/bicep
          bicep --version

      - name: Build Bicep
        run: |
          bicep build infra/main.bicep --stdout > /dev/null
          bicep lint infra/main.bicep

      - name: Shell syntax
        run: for f in infra/*.sh scripts/*.sh; do bash -n "$f" && echo "ok $f"; done
